# /etc/nginx/sites-available/eplenarius  (ln -s em sites-enabled)
# Certificado: certbot --nginx -d eplenarius.2-25-152-184.sslip.io
# Evite subdomínio "api.*": apps antigos faziam .replace('/api','') na URL.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Rate limit por IP (zonas exclusivas deste projeto). Na câmara os tablets saem pelo
# mesmo IP (NAT), por isso os limites gerais são folgados; login é mais restrito.
limit_req_zone $binary_remote_addr zone=eplen_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=eplen_auth:10m rate=30r/m;

server {
  server_name eplenarius.2-25-152-184.sslip.io;

  client_max_body_size 25m;   # PDF até 20 MB
  limit_req_status 429;
  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/auth/ {
    limit_req zone=eplen_auth burst=30 nodelay;
    proxy_pass http://127.0.0.1:3010;
  }

  # Socket.io (namespace /voting): conexões longas, sem rate limit
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    limit_req zone=eplen_api burst=120 nodelay;
    proxy_pass http://127.0.0.1:3010;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/eplenarius.2-25-152-184.sslip.io/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/eplenarius.2-25-152-184.sslip.io/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = eplenarius.2-25-152-184.sslip.io) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  server_name eplenarius.2-25-152-184.sslip.io;
  return 404; # managed by Certbot
}
